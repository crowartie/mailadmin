# Выпуск мобильного приложения: метка mobile-vX.Y.Z → проверка, сборка подписанного APK,
# выпуск в GitHub Releases. Приложение само находит его («Ещё → О приложении») и предлагает обновиться.
#
# Секреты репозитория (Settings → Secrets and variables → Actions) заводит администратор:
#   ANDROID_KEYSTORE_BASE64  — keystore (.jks) в base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Без них сборка остановится: неподписанный или подписанный отладочным ключом APK поверх
# установленного не встанет.
name: mobile-release

on:
  push:
    tags: ['mobile-v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Версия в метке совпадает с версией сборки
        run: |
          tag="${GITHUB_REF_NAME#mobile-v}"
          ver=$(grep -oP 'val appVersion = "\K[^"]+' composeApp/build.gradle.kts)
          test "$tag" = "$ver" || { echo "метка $tag, а в build.gradle.kts $ver"; exit 1; }

      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" || { echo "нет секрета ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KS" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Тесты (без живого сервера)
        run: ./gradlew :composeApp:desktopTest --tests 'su.innotec.mail.CoreTest'

      - name: Сборка APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Pochta-${GITHUB_REF_NAME#mobile-v}.apk"
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "Почта ${GITHUB_REF_NAME#mobile-v}" --notes-file CHANGELOG.md
